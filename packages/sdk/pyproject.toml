[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdispatcher-sdk"
version = "0.1.0"
description = "Bounded telemetry exporter for LLM/API applications and scheduled jobs"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx==0.28.1", "opentelemetry-api==1.45.2"]

[tool.setuptools.packages.find]
where = ["src"]
