name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      DISPATCHER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      DISPATCHER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: pip install -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: npm ci
      - run: ruff check packages scripts tests
      - name: Ensure matching PostgreSQL recovery clients
        run: |
          if [ ! -x "$DISPATCHER_PG_DUMP" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
      - run: pytest -q
      - run: npm install --global @openai/codex@0.164.0
      - run: python scripts/verify_codex_telemetry.py
      - run: npm run build
      - run: python scripts/notices.py

  compose:
    runs-on: ubuntu-latest
    env:
      DISPATCHER_TOOL_RESOURCE_URL: http://127.0.0.1:8090/mcp
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/configure.py
      - run: docker compose up --build -d --wait
      - run: docker compose --profile demo run --rm demo > /tmp/demo.json
      - run: docker compose restart worker
      - run: curl --fail http://127.0.0.1:8088/health/ready
      - name: Build and exercise optional private backup profile
        run: docker compose --profile recovery run --build --rm recovery backup /backups/ci.dump
      - name: Prepare synthetic LiteLLM profile
        run: docker compose run --rm --no-deps --user 0 -v "$PWD:/workspace" api python scripts/gateway_smoke.py --prepare /workspace/gateway-fixture.yaml --source /workspace/services/gateway/config.yaml
      - name: Start LiteLLM with synthetic provider responses
        run: GATEWAY_CONFIG_PATH=./gateway-fixture.yaml docker compose --profile gateway up -d gateway
      - name: Verify real LiteLLM image and callback boundary
        run: docker compose exec -T api python scripts/gateway_smoke.py
      - name: Start optional MCP service
        run: docker compose --profile mcp up --build -d mcp
      - name: Verify MCP tenant and session boundary
        run: docker compose exec -T api python scripts/mcp_smoke.py
      - name: Prepare private collector fixture credentials
        run: docker compose run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD:/workspace" api python scripts/collector_smoke.py --prepare /workspace/.collector-fixture.env
      - name: Start authenticated collector profile
        run: docker compose --env-file .env --env-file .collector-fixture.env --profile telemetry up -d collector
      - name: Verify real collector ingestion and correlation
        run: docker compose run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD/.collector-fixture.env:/app/collector-fixture.env:ro" api python scripts/collector_smoke.py --state /app/collector-fixture.env
      - if: always()
        run: docker compose logs --tail 100 api worker migrate gateway mcp collector
      - if: always()
        run: docker compose down

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/mcp/requirements.lock
      - run: pip install --no-deps ./packages/sdk
      - run: python -m unittest discover -s services/mcp -p 'test_*.py'
      - run: python scripts/notices.py --python-only-root services/mcp
