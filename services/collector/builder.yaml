dist:
  module: github.com/biskilled/agentdispatcher/collector
  name: otelcol-contrib
  description: AgentDispatcher minimal OpenTelemetry Collector
  version: 0.164.0-dispatcher.1
  output_path: /build/collector
  build_tags: grpcnotrace
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
